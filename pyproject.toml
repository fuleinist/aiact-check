[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiact-check"
version = "0.1.0"
description = "CLI scanner for EU AI Act compliance — detects AI usage, checks banned practices, generates obligation checklists and compliance docs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "fuleinist" }]
keywords = ["eu-ai-act", "compliance", "ai-governance", "scanner", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/fuleinist/aiact-check"
Repository = "https://github.com/fuleinist/aiact-check"

[project.scripts]
aiact-check = "aiact_check.cli:main"

[tool.setuptools.packages.find]
include = ["aiact_check*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
